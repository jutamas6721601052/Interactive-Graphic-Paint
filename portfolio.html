<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
  // Scene / Camera / Renderer
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xFFFFFF);

  const camera = new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    0.1,
    100
  );
  camera.position.set(0, 3, 20);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.toneMappingExposure = 1.0;
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  controls.addEventListener('start', () => {
    isFocusing = false;
  });

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
  dirLight.position.set(5, 10, 7.5);
  scene.add(dirLight);

  const clock = new THREE.Clock();
  const mixers = [];


  const globalUniforms = {
    uTime: { value: 0.0 },
    uLightDir: { value: new THREE.Vector3(0.4, 1.0, 0.8).normalize() },
    uOutlineThickness: { value: 0.01 }
  };


  function createToonMaterial(textureMap, colorHex = 0xffffff, enableWave = false) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uTime: globalUniforms.uTime,
        uLightDir: globalUniforms.uLightDir,
        uTexture: { value: textureMap },
        uHasTexture: { value: textureMap ? 1.0 : 0.0 },
        uBaseColor: { value: new THREE.Color(colorHex) }
      },
      vertexShader: `
        uniform float uTime;
        varying vec3 vNormal;
        varying vec2 vUv;
        void main() {
          vUv = uv;
          vNormal = normalMatrix * normal;
          vec3 pos = position;
          ${enableWave ? 'pos.z += sin(pos.x * 5.0 + uTime * 2.0) * 0.15;' : ''}
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        precision mediump float;
        uniform sampler2D uTexture;
        uniform float uHasTexture;
        uniform vec3 uBaseColor;
        uniform vec3 uLightDir;
        varying vec3 vNormal;
        varying vec2 vUv;
        void main() {
          vec3 N = normalize(vNormal);
          vec3 L = normalize(uLightDir);

          vec3 texColor = (uHasTexture > 0.5) ? texture2D(uTexture, vUv).rgb : vec3(1.0);
          vec3 color = texColor * uBaseColor;
          
          float ambient = 0.35;
          float diffuse = max(dot(N, L), 0.0);
          diffuse = smoothstep(0.1, 0.2, diffuse);
          
          vec3 finalColor = color * (diffuse + ambient);
          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      side: THREE.DoubleSide
    });
  }

  function createOutlineMaterial(enableWave = false) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uTime: globalUniforms.uTime,
        uOutlineThickness: globalUniforms.uOutlineThickness
      },
      vertexShader: `
        uniform float uTime;
        uniform float uOutlineThickness;
        void main() {
          vec3 pos = position;
          pos += normal * uOutlineThickness;
          ${enableWave ? 'pos.z += sin(pos.x * 5.0 + uTime * 2.0) * 0.15;' : ''}
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        precision mediump float;
        void main() {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
        }
      `,
      side: THREE.BackSide
    });
  }


  const pickables = [];
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let picked_object = null;

  const targetCameraPos = new THREE.Vector3();
  const targetControlsTarget = new THREE.Vector3();
  let isFocusing = false;

  renderer.domElement.addEventListener('click', onPick);
  function onPick(e) {
    const r = renderer.domElement.getBoundingClientRect();
    const x = (e.clientX ?? e.touches[0].clientX) - r.left;
    const y = (e.clientY ?? e.touches[0].clientY) - r.top;
    pointer.x = (x / r.width) * 2 - 1;
    pointer.y = -(y / r.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObjects(pickables, true)[0];
    
    if (hit == null) {
      picked_object = null;
      isFocusing = false;
      return;
    } 
    picked_object = hit.object;
    console.log('Picked object name:', picked_object.name);

    const box = new THREE.Box3().setFromObject(picked_object);
    const center = box.getCenter(new THREE.Vector3());
    const sphere = box.getBoundingSphere(new THREE.Sphere());

    const fovRad = (camera.fov * Math.PI) / 180;
    let zoomDistance = (sphere.radius / Math.sin(fovRad / 2)) * 1.2;
    zoomDistance = Math.max(zoomDistance, 1.8);

    const currentDir = camera.position.clone().sub(controls.target).normalize();
    currentDir.y = Math.max(currentDir.y, 0.15);
    currentDir.normalize();

    targetCameraPos.copy(center).add(currentDir.multiplyScalar(zoomDistance));
    targetControlsTarget.copy(center);

    isFocusing = true;
  }

  const gltfLoader = new THREE.GLTFLoader();

  function addPickableObject(name, URL, scale = 1.0, allowedMeshNames = null, shaderOptions = {}) {
    const { useToonShader = false, colorHex = 0xffffff, enableWave = false } = shaderOptions;

    gltfLoader.load(URL, (gltf) => {
      const model = gltf.scene;
      model.name = name;
      model.scale.setScalar(scale);

      if (useToonShader) {
        model.traverse((child) => {
          if (child.isMesh) {
            const origMap = child.material ? child.material.map : null;
            child.material = createToonMaterial(origMap, colorHex, enableWave);
          }
        });

        const outlineModel = model.clone();
        outlineModel.traverse((child) => {
          if (child.isMesh) {
            child.material = createOutlineMaterial(enableWave);
          }
        });
        scene.add(outlineModel);
      }

      model.traverse((child) => {
        if (child.isMesh) {
          if (allowedMeshNames === null || allowedMeshNames.length === 0 || allowedMeshNames.includes(child.name)) {
            pickables.push(child);
          }
        }
      });

      if (gltf.animations && gltf.animations.length > 0) {
        const mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => {
          const action = mixer.clipAction(clip);
          action.play();
        });
        mixers.push(mixer);
      }

      scene.add(model);
    }, undefined, (err) => {
      console.error('An error happened loading the GLB model:', err);
    });
  }

  addPickableObject(
    'inner', 
    'https://jutamas6721601052.github.io/Interactive-Graphic-Paint/inner.glb', 
    1.0, 
    ['Plane056','Plane009_1'],
    { useToonShader: false, enableWave: false }
  );

  addPickableObject(
    'home', 
    'https://jutamas6721601052.github.io/Interactive-Graphic-Paint/home.glb', 
    1.0, 
    ['Cube.011', 'Cube.006', 'Plane.056', 'Plane002'], 
    { useToonShader: true, colorHex: 0xD2B48C, enableWave: false }
  );


  addPickableObject('out', 'https://jutamas6721601052.github.io/Interactive-Graphic-Paint/out.glb', 1.0, [], { useToonShader: true, enableWave: true });
  addPickableObject('box', 'https://jutamas6721601052.github.io/Interactive-Graphic-Paint/box.glb', 1.0, []);

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });

  function animate(time) {
    requestAnimationFrame(animate);

    globalUniforms.uTime.value = time * 0.001;

    const delta = clock.getDelta();
    mixers.forEach((mixer) => mixer.update(delta));

    if (isFocusing) {
      camera.position.lerp(targetCameraPos, 0.08);
      controls.target.lerp(targetControlsTarget, 0.08);
    }
    controls.update();
    renderer.render(scene, camera);
  }

  animate(0);
</script>
</body>
</html>
